# Pre-commit hooks that match CI checks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# AUTO-FIX BEHAVIOR:
# - Ruff: Auto-fixes all linting issues (including unsafe fixes like isinstance modernization)
# - Ruff-format: Auto-formats Python code
# - ESLint: Auto-fixes JavaScript/TypeScript linting issues
# - Other hooks: Auto-fix whitespace, line endings, etc.
#
# Only fails if there are issues that cannot be auto-fixed (like type errors)

repos:
  # Backend Python checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11  # Match requirements.txt version
    hooks:
      # Run the checker with auto-fix
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
        files: ^app/
      # Run the formatter (formats in place)
      - id: ruff-format
        files: ^app/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1  # Match requirements.txt version
    hooks:
      - id: mypy
        language_version: python3.12  # pinned deps (e.g. fastapi) require >=3.11
        args: [--install-types, --non-interactive, --ignore-missing-imports]
        files: ^app/
        additional_dependencies:
          # Keep in sync with requirements.txt pins
          - types-requests==2.33.0.20261030
          - types-PyMySQL
          - types-python-dateutil==2.9.0.20261116
          - types-ujson
          - alembic==1.20.1
          - fastapi==0.165.0
          - pydantic==2.14.4
          - sqlalchemy==2.1.9

  # Frontend checks
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint -- --fix'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: tsc
        name: TypeScript type check
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags in docker-compose
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending
